<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Record of Becoming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --void: #0d0a14;
    --void-2: #15101f;
    --nebula: #1d1726;
    --oxblood: #6e2418;
    --oxblood-bright: #9a3424;
    --ember: #c25438;
    --gold: #c7a253;
    --gold-soft: #d9bd82;
    --cream: #f4efe6;
    --cream-dim: #cabfae;
    --mist: #8b8194;
    --line: rgba(199,162,83,0.18);
    --line-soft: rgba(244,239,230,0.08);
    --jade: #4f8a6b;
  }
  html { font-size: 16px; scroll-behavior: smooth; }
  .divider[id] { scroll-margin-top: 76px; }
  body {
    background: var(--void);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    line-height: 1.65;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* ---- cosmic field ---- */
  .starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .ambient span {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5;
  }
  .ambient .a1 { width: 480px; height: 480px; top: 12%; left: -8%; background: radial-gradient(circle, rgba(110,36,24,0.55), transparent 70%); }
  .ambient .a2 { width: 520px; height: 520px; top: 48%; right: -10%; background: radial-gradient(circle, rgba(47,58,92,0.5), transparent 70%); }
  .ambient .a3 { width: 420px; height: 420px; top: 78%; left: 20%; background: radial-gradient(circle, rgba(176,141,44,0.32), transparent 70%); }
  .star { position: absolute; border-radius: 50%; background: var(--cream); }
  .content { position: relative; z-index: 2; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  /* ---- top nav ---- */
  .topnav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 60;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px;
    background: linear-gradient(rgba(13,10,20,0.5), transparent);
  }
  .topnav .brand { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: var(--gold-soft); letter-spacing: 0.04em; }
  .menu-toggle {
    background: rgba(244,239,230,0.06); border: 1px solid rgba(199,162,83,0.22);
    color: var(--gold-soft); border-radius: 10px; width: 40px; height: 38px;
    cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: all 0.2s;
  }
  .menu-toggle:hover { border-color: var(--oxblood-bright); color: var(--cream); }
  .accordion {
    position: fixed; top: 66px; right: 28px; z-index: 59;
    width: 320px; max-height: 0; overflow: hidden;
    background: rgba(13,10,20,0.92); border: 1px solid rgba(199,162,83,0.22);
    border-radius: 16px; opacity: 0;
    padding-bottom: 12px;
    backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%);
    transition: max-height 0.4s ease, opacity 0.28s ease;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
  }
  .accordion.open { max-height: 640px; opacity: 1; }
  .rec-pill {
    display: block; width: calc(100% - 24px); margin: 12px 12px 0; text-align: left;
    background: rgba(244,239,230,0.04); border: 1px solid rgba(199,162,83,0.18);
    border-radius: 12px; padding: 13px 16px; cursor: pointer; transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .rec-pill:hover { border-color: var(--oxblood-bright); background: rgba(154,52,36,0.12); }
  .rec-pill.active { background: rgba(154,52,36,0.2); border-color: var(--oxblood-bright); }
  .rec-pill .rec-date { display: block; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 3px; }
  .rec-pill .rec-name { display: block; font-family: 'Fraunces', serif; font-size: 15px; color: var(--cream); line-height: 1.25; }
  .chapter-nest {
    margin: 6px 12px 14px; padding-left: 14px;
    border-left: 1px solid rgba(199,162,83,0.25);
  }
  .chapter-nest a {
    display: flex; align-items: baseline; gap: 11px;
    padding: 9px 10px; color: var(--cream-dim); text-decoration: none;
    font-size: 13.5px; border-radius: 8px; transition: background 0.18s, color 0.18s;
  }
  .chapter-nest a:hover { background: rgba(154,52,36,0.16); color: var(--cream); }
  .chapter-nest a .rn { font-family: 'Fraunces', serif; font-size: 12px; color: var(--gold); min-width: 24px; }
  .forge-frame {
    position: fixed; inset: 0; z-index: 40;
    width: 100%; height: 100%; border: none; background: #faf7f2;
    display: none;
  }
  body.viewing-forge .content { display: none; }
  body.viewing-forge #forgeFrame { display: block; }
  body.viewing-forge .chapter-nest { display: none; }
  body.viewing-sadhana .content { display: none; }
  body.viewing-sadhana #sadhanaFrame { display: block; }
  body.viewing-sadhana .topnav { display: none; }
  body.viewing-sadhana .accordion { display: none; }
  body.viewing-brahma #brahmaFrame { display: block; }
  body.viewing-forge .accordion { background: rgba(3,51,78,0.96); border-color: rgba(237,110,87,0.4); }
  /* Forge palette: navy #03334e, coral #ed6e57, parchment #faf7f2 */
  body.viewing-forge .topnav { background: linear-gradient(rgba(3,51,78,0.85), rgba(3,51,78,0.0)); }
  body.viewing-forge .topnav .brand { color: var(--cream); font-style: italic; }
  body.viewing-forge .menu-toggle { background: rgba(237,110,87,0.16); border-color: rgba(237,110,87,0.5); color: #ed6e57; }
  body.viewing-forge .menu-toggle:hover { border-color: #ed6e57; color: var(--cream); }
  body.viewing-forge .rec-pill { background: rgba(250,247,242,0.05); border-color: rgba(237,110,87,0.3); }
  body.viewing-forge .rec-pill.active { background: rgba(237,110,87,0.22); border-color: #ed6e57; }
  body.viewing-forge .rec-pill .rec-date { color: #ed6e57; }
  body.viewing-forge .rec-pill .rec-name { color: var(--cream); }
  body.viewing-forge .chapter-nest { border-left-color: rgba(237,110,87,0.35); }
  body.viewing-forge .chapter-nest a { color: rgba(250,247,242,0.7); }
  body.viewing-forge .chapter-nest a .rn { color: #ed6e57; }
  body.viewing-forge .chapter-nest a:hover { background: rgba(237,110,87,0.16); color: var(--cream); }
  .pad-top { height: 56px; }
  @media (max-width: 700px) {
    .topnav .brand { font-size: 15px; }
    .accordion { right: 14px; width: calc(100% - 28px); max-width: 340px; }
    .hero-inner { text-align: center; margin: 0 auto; }
    .hero { justify-content: center; }
  }

  /* ---- HERO ---- */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 80px 0 70px;
    overflow: hidden;
  }
  .hero-glow {
    position: absolute;
    top: 42%; left: 50%;
    transform: translate(-50%,-50%);
    width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(242,184,98,0.20) 0%, rgba(154,52,36,0.16) 40%, transparent 72%);
    border-radius: 50%;
    z-index: 0;
    filter: blur(16px);
    pointer-events: none;
  }
  #solarSystem {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  .orrery-note {
    font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--mist); margin-top: 24px;
  }

  .hero-inner { position: relative; z-index: 3; text-align: left; max-width: 620px; }
  .sanskrit {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: clamp(20px, 3vw, 28px); color: var(--gold-soft);
    margin-bottom: 8px; letter-spacing: 0.04em;
  }
  h1.title {
    font-family: 'Fraunces', serif; font-weight: 500;
    font-size: clamp(46px, 8vw, 92px); line-height: 0.94;
    letter-spacing: -0.02em; color: var(--cream); margin-bottom: 4px;
  }
  h1.title em { font-style: italic; color: var(--ember); font-weight: 500; }
  .hero-sub {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(18px, 2.4vw, 23px); color: var(--cream-dim);
    max-width: 540px; margin: 26px 0 0; line-height: 1.55;
  }
  .scroll-hint {
    margin-top: 40px; font-size: 11px; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--mist);
  }

  /* ---- TIMELINE STRIP ---- */
  .timeline {
    position: relative; z-index: 3;
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    margin: 0 0 0;
  }
  .mb { padding: 22px 14px; border-right: 1px solid var(--line-soft); }
  .mb:last-child { border-right: none; }
  .mb .m { font-family: 'Fraunces', serif; font-size: 16px; color: var(--gold); margin-bottom: 6px; }
  .mb .d { font-size: 12px; color: var(--mist); line-height: 1.45; }
  .mb.now .m { color: var(--ember); }

  /* ---- SECTIONS ---- */
  section.block { position: relative; z-index: 3; padding: 72px 0 0; }
  .divider {
    display: flex; align-items: center; gap: 18px; margin-bottom: 40px;
  }
  .divider .num { font-family: 'Fraunces', serif; font-size: 15px; color: var(--oxblood-bright); }
  .divider .lbl { font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
  .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  h2 {
    font-family: 'Fraunces', serif; font-weight: 500;
    font-size: clamp(26px, 4vw, 38px); letter-spacing: -0.015em;
    line-height: 1.08; color: var(--cream); margin-bottom: 14px;
  }
  h2 em { font-style: italic; color: var(--ember); }
  .card-label {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gold); font-weight: 500; margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .card-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ember); }

  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
  .col-4 { grid-column: span 4; }
  .col-6 { grid-column: span 6; }
  .col-8 { grid-column: span 8; }
  .col-12 { grid-column: span 12; }

  .card {
    background:
      linear-gradient(135deg, rgba(244,239,230,0.11) 0%, rgba(244,239,230,0.04) 38%, rgba(29,23,38,0.30) 100%);
    border: 1px solid rgba(244,239,230,0.14);
    border-radius: 16px;
    padding: 28px 30px;
    position: relative;
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow:
      inset 0 1px 0 rgba(244,239,230,0.18),
      inset 0 0 0 1px rgba(244,239,230,0.03),
      0 16px 44px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.10), transparent 42%);
    pointer-events: none;
  }
  .card > * { position: relative; z-index: 1; }
  .card p { color: var(--cream-dim); font-size: 15px; }

  /* ---- stat cards ---- */
  .stat .big {
    font-family: 'Fraunces', serif; font-size: 58px; font-weight: 500;
    color: var(--ember); line-height: 1; letter-spacing: -0.02em; margin: 4px 0 14px;
  }

  /* ---- app constellation ---- */
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; margin-top: 6px; }
  .app {
    background: rgba(244,239,230,0.04); border: 1px solid rgba(199,162,83,0.16);
    border-radius: 12px; padding: 14px 16px; transition: border-color 0.2s, transform 0.2s, background 0.2s;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .app:hover { border-color: var(--oxblood-bright); transform: translateY(-2px); background: rgba(154,52,36,0.1); }
  .app .nm { font-family: 'Fraunces', serif; font-size: 16px; color: var(--cream); }
  .app .rl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mist); margin-top: 4px; }
  .app .url { font-size: 11px; color: var(--gold); margin-top: 4px; font-family: 'Inter', sans-serif; }

  /* ---- checklist ---- */
  ul.check { list-style: none; }
  ul.check li {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 9px 0; border-bottom: 1px solid var(--line-soft);
    font-size: 14.5px; color: var(--cream-dim);
  }
  ul.check li:last-child { border-bottom: none; }
  .tick {
    flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%;
    background: var(--oxblood); display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
  }
  .tick::after { content: "✦"; font-size: 9px; color: var(--gold-soft); }

  /* ---- tags ---- */
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .tag {
    font-size: 12px; padding: 6px 13px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--cream-dim); font-family: 'Inter', sans-serif;
  }
  .tag.ember { background: rgba(154,52,36,0.16); border-color: rgba(194,84,56,0.4); color: var(--ember); }
  .tag.gold { background: rgba(199,162,83,0.12); border-color: rgba(199,162,83,0.35); color: var(--gold-soft); }
  .tag.jade { background: rgba(79,138,107,0.14); border-color: rgba(79,138,107,0.4); color: #7fb89a; }

  /* ---- progress ---- */
  .prow { margin-bottom: 16px; }
  .plabel { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 7px; color: var(--cream-dim); }
  .pbar { height: 6px; background: rgba(244,239,230,0.08); border-radius: 4px; overflow: hidden; }
  .pfill { height: 100%; border-radius: 4px; background: var(--oxblood-bright); }
  .pfill.gold { background: var(--gold); }
  .pfill.jade { background: var(--jade); }

  /* ---- feature cards ---- */
  .accent {
    background: linear-gradient(160deg, rgba(110,36,24,0.72), rgba(154,52,36,0.55));
    border: 1px solid rgba(199,162,83,0.4); border-radius: 16px;
    backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(244,239,230,0.12), 0 12px 40px rgba(0,0,0,0.4);
  }
  .accent h2, .accent .card-label { color: var(--cream); }
  .accent .card-label { color: var(--gold-soft); }
  .accent p { color: rgba(244,239,230,0.9); }

  .verdict {
    background: linear-gradient(135deg, rgba(154,52,36,0.20) 0%, rgba(244,239,230,0.04) 45%, rgba(29,23,38,0.3) 100%);
    border: 1px solid rgba(199,162,83,0.32); border-radius: 16px;
    padding: 32px 34px; margin-top: 20px; position: relative; overflow: hidden;
    backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow: inset 0 1px 0 rgba(244,239,230,0.18), 0 16px 44px rgba(0,0,0,0.42);
  }
  .verdict::before { content:""; position:absolute; inset:0; background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent 40%); pointer-events:none; }
  .verdict > * { position: relative; z-index: 1; }
  .verdict .vh { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); font-weight: 500; margin-bottom: 14px; }
  .verdict p { font-family: 'Cormorant Garamond', serif; font-size: 20px; line-height: 1.6; color: var(--cream); }
  .verdict strong { color: var(--ember); font-weight: 500; }

  /* ---- gratitude / quote ---- */
  .gratitude {
    border: 1px solid var(--gold); border-radius: 16px; padding: 40px 42px;
    background: radial-gradient(circle at 80% 0%, rgba(110,36,24,0.3), transparent 60%), rgba(29,23,38,0.45);
    backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(244,239,230,0.08), 0 12px 40px rgba(0,0,0,0.35);
  }
  .gratitude p { font-family: 'Cormorant Garamond', serif; font-size: 19px; line-height: 1.75; color: var(--cream-dim); max-width: 760px; }

  .pull {
    text-align: center; padding: 64px 0 0;
  }
  .pull q {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
    font-size: clamp(22px, 3.4vw, 32px); line-height: 1.4; color: var(--cream);
    quotes: """ """; display: block; max-width: 880px; margin: 0 auto;
  }
  .pull q span { color: var(--ember); font-style: normal; }
  .pull .om { font-family: 'Cormorant Garamond', serif; font-style: italic; color: var(--gold); font-size: 24px; margin: 28px 0 0; }

  /* ---- cohort rail ---- */
  .cohorts { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
  .cohort {
    background: linear-gradient(135deg, rgba(244,239,230,0.10) 0%, rgba(244,239,230,0.035) 40%, rgba(29,23,38,0.28) 100%);
    border: 1px solid rgba(244,239,230,0.13);
    border-radius: 14px; padding: 22px 22px 20px; text-align: center;
    backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%);
    box-shadow: inset 0 1px 0 rgba(244,239,230,0.18), 0 14px 40px rgba(0,0,0,0.4);
  }
  .cohort .ch { font-family: 'Fraunces', serif; font-size: 17px; color: var(--gold-soft); margin-bottom: 4px; }
  .cohort .resp { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mist); margin-bottom: 16px; }
  .scores { display: flex; justify-content: center; gap: 18px; }
  .score .sv { font-family: 'Fraunces', serif; font-size: 30px; color: var(--ember); line-height: 1; }
  .score .sl { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mist); margin-top: 6px; }
  .cohort .nps { margin-top: 16px; font-size: 12px; color: var(--cream-dim); border-top: 1px solid var(--line-soft); padding-top: 12px; }
  .cohort .nps b { color: var(--gold-soft); font-weight: 500; }

  .voices { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap: 14px; margin-top: 6px; }
  .voice {
    background: linear-gradient(135deg, rgba(244,239,230,0.10) 0%, rgba(244,239,230,0.035) 42%, rgba(29,23,38,0.26) 100%);
    border: 1px solid rgba(244,239,230,0.12);
    border-left: 2px solid var(--oxblood-bright); border-radius: 0 12px 12px 0;
    padding: 18px 20px;
    backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%);
    box-shadow: inset 0 1px 0 rgba(244,239,230,0.16), 0 12px 34px rgba(0,0,0,0.38);
  }
  .voice q {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px;
    line-height: 1.5; color: var(--cream); quotes: """ """; display: block;
  }
  .voice .who { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-top: 12px; }
  .voice.feature { border-left-color: var(--gold); border-left-width: 3px; background: rgba(244,239,230,0.04); }

  footer {
    position: relative; z-index: 3;
    text-align: center; padding: 70px 0 90px; margin-top: 60px;
    border-top: 1px solid var(--line);
  }
  footer .sig { font-family: 'Fraunces', serif; font-style: italic; font-size: 24px; color: var(--cream); margin-bottom: 10px; }
  footer .meta { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mist); }
  footer .meta strong { color: var(--gold); font-weight: 500; }

  @media (max-width: 860px) {
    .col-4, .col-6, .col-8 { grid-column: span 12; }
    .timeline { grid-template-columns: repeat(2, 1fr); }
    .mb { border-bottom: 1px solid var(--line-soft); }
    .cohorts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav class="topnav">
  <div class="brand">Sādhana</div>
  <button class="menu-toggle" id="menuToggle" aria-label="Open menu" onclick="toggleMenu()">☰</button>
</nav>

<div class="accordion" id="accordion">
  <button class="rec-pill" id="btn-forge" onclick="showForge()">
    <span class="rec-date">Feb – May 2026</span>
    <span class="rec-name">The Forge</span>
  </button>
  <button class="rec-pill" id="btn-brahma" onclick="showBrahma()">
    <span class="rec-date">June 2026</span>
    <span class="rec-name">Nāda Brahma — the sound becomes form</span>
  </button>
  <div class="chapter-nest">
    <a href="#sec-numbers" onclick="goChapter(event)"><span class="rn">I</span>By the numbers</a>

<iframe class="forge-frame" id="sadhanaFrame" title="Sādhana — September 2026 record"></iframe>

<iframe class="forge-frame" id="brahmaFrame" title="Nāda Brahma — Feb to June record"></iframe>

<script>
  (function(){
    var forgeFrame = document.getElementById('forgeFrame');
    var sadhanaFrame = document.getElementById('sadhanaFrame');
    var brahmaFrame = document.getElementById('brahmaFrame');

    window.showSadhana = function(){
      sadhanaFrame.src = 'sadhana.html';
      document.body.classList.add('viewing-sadhana');
      document.body.classList.remove('viewing-forge');
      document.body.classList.remove('viewing-brahma');
      document.getElementById('btn-sadhana').classList.add('active');
      document.getElementById('btn-forge').classList.remove('active');
      document.getElementById('btn-brahma').classList.remove('active');
      document.querySelector('.topnav .brand').textContent='Sādhana';
      closeMenu();
      window.scrollTo(0,0);
    };
    window.showForge = function(){
      forgeFrame.src = 'forge.html';
      document.body.classList.add('viewing-forge');
      document.body.classList.remove('viewing-sadhana');
      document.body.classList.remove('viewing-brahma');
      document.getElementById('btn-forge').classList.add('active');
      document.getElementById('btn-brahma').classList.remove('active');
      document.getElementById('btn-sadhana').classList.remove('active');
      document.querySelector('.topnav .brand').textContent='The Forge';
      closeMenu();
      window.scrollTo(0,0);
    };
    window.showBrahma = function(){
      brahmaFrame.src = 'nada-brahma.html';
      document.body.classList.add('viewing-brahma');
      document.body.classList.remove('viewing-forge');
      document.body.classList.remove('viewing-sadhana');
      document.getElementById('btn-brahma').classList.add('active');
      document.getElementById('btn-forge').classList.remove('active');
      document.getElementById('btn-sadhana').classList.remove('active');
      document.querySelector('.topnav .brand').textContent='Nāda Brahma';
      closeMenu();
      window.scrollTo(0,0);
    };
    window.goChapter = function(e){
      // Nāda Brahma now lives in its own file (nada-brahma.html), loaded into
      // its own iframe — so this just switches to that view. It no longer
      // deep-links to the specific chapter anchor (e.g. "By the numbers"),
      // since that anchor lives inside a separate document now. A known,
      // honest tradeoff for the file being properly split out.
      e.preventDefault();
      window.showBrahma();
      closeMenu();
    };
    window.toggleMenu = function(){ document.getElementById('accordion').classList.toggle('open'); };
    window.closeMenu = function(){ document.getElementById('accordion').classList.remove('open'); };
    document.addEventListener('click', function(e){
      var acc = document.getElementById('accordion');
      var tog = document.getElementById('menuToggle');
      if(acc.classList.contains('open') && !acc.contains(e.target) && e.target!==tog){ acc.classList.remove('open'); }
    });
    showSadhana();
  })();

</script>
